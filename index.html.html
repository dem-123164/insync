<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>InSync · Birlikte keşfet</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#161616;font:15px system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.shell{max-width:620px;margin:auto;min-height:100dvh;background:white;border-inline:1px solid #ececec}.top{height:62px;position:sticky;top:0;background:#fff;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #eee}.brand{font-weight:800;font-size:26px;letter-spacing:-1.4px}.iconbtn{border:0;background:none;padding:9px;font-size:22px;color:#171717}.view{display:none;padding-bottom:calc(90px + env(safe-area-inset-bottom))}.view.active{display:block}.tabs{display:flex;border-bottom:1px solid #eee}.tabs button{width:50%;padding:15px;border:0;background:#fff;color:#777}.tabs button.active{color:#111;font-weight:700;border-bottom:2px solid #111}.composer{display:flex;align-items:center;gap:12px;padding:17px 18px;border-bottom:8px solid #f7f7f7;cursor:pointer;color:#888}.avatar{height:42px;width:42px;flex:none;border-radius:50%;background:#ececec;display:grid;place-items:center;font-weight:700;color:#333;background-size:cover;background-position:center}.avatar.large{height:80px;width:80px;font-size:27px}.post{display:flex;gap:12px;padding:20px 18px;border-bottom:1px solid #eee}.postbody{min-width:0;flex:1}.posthead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.name{font-weight:700}.muted{color:#888;font-size:12px}.posttext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;margin:9px 0}.actions{display:flex;gap:20px;margin-top:13px}.actions button{border:0;background:none;padding:3px;font-size:20px}.sectionhead{font-size:21px;font-weight:750;padding:24px 18px 12px}.subhead{padding:0 18px 15px;color:#777;font-size:13px}.roomitem{display:flex;gap:13px;align-items:center;padding:17px 18px;border-bottom:1px solid #eee;cursor:pointer}.roomemoji{font-size:25px;width:46px;height:46px;border-radius:15px;background:#f5f5f5;display:grid;place-items:center}.grow{flex:1;min-width:0}.roomname{font-weight:700}.roomdesc{font-size:13px;color:#777;margin-top:5px}.pill{font-size:12px;border:1px solid #ddd;border-radius:20px;padding:5px 10px}.nav{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;background:#fff;border-top:1px solid #eee;z-index:10;padding-bottom:env(safe-area-inset-bottom);height:calc(62px + env(safe-area-inset-bottom));align-items:center;justify-content:space-around}.nav button{background:none;border:0;font-size:23px;padding:10px 15px;color:#777}.nav button.selected{color:#111}.form{padding:20px 18px}.field{width:100%;border:1px solid #ddd;border-radius:12px;padding:13px;margin:8px 0 14px;background:#fff}.primary{background:#111;color:#fff;border:0;border-radius:24px;padding:12px 20px;font-weight:650}.secondary{background:#fff;color:#111;border:1px solid #ddd;border-radius:24px;padding:11px 18px}.notice{padding:12px 18px;color:#777;font-size:13px}.profile{padding:23px 18px}.profiletop{display:flex;justify-content:space-between;align-items:center}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.tag{border:1px solid #ddd;border-radius:20px;padding:7px 11px;font-size:13px}.chatmessages{padding:18px;min-height:40vh}.bubble{padding:11px 13px;border-radius:14px;background:#f5f5f5;margin-bottom:10px;overflow-wrap:anywhere}.bubble.mine{background:#ededed}.chatbar{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #eee;padding:10px;display:flex;gap:8px;z-index:4}.chatbar input{flex:1;min-width:0;margin:0}.empty{padding:25px 18px;color:#777}.auth{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:30px;max-width:430px;margin:auto}.auth h1{font-size:44px;letter-spacing:-2px;margin:0}.auth p{color:#777}.hidden{display:none!important}@media(max-width:620px){body{background:white}.shell{border:0}.nav{left:0;transform:none}.top{height:58px}}
</style></head><body><div class="shell"><section id="auth" class="auth"><h1>InSync</h1><p>Ortak ilgi alanlarında buluş.</p><input id="email" class="field" type="email" autocomplete="email" placeholder="E-posta"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Şifre (en az 6 karakter)"><button class="primary" id="login">Giriş Yap</button><button class="secondary" id="register" style="margin-top:12px">Üye Ol</button><div id="authStatus" class="notice" role="status"></div></section>
<div id="main" class="hidden"><header class="top"><button id="menu" class="iconbtn" aria-label="Menü">⋯</button><span class="brand">InSync</span><button class="iconbtn" id="topProfile" aria-label="Profilim">◎</button></header><div id="menuPanel" class="hidden form" style="border-bottom:1px solid #eee"><button id="logout" class="secondary">Çıkış yap</button></div>
<section id="feed" class="view active"><div class="tabs"><button class="active" data-feed="all">Sana özel</button><button data-feed="mine">Paylaşımlarım</button></div><div class="composer" id="composeShortcut"><div class="avatar" id="composeAvatar">İ</div><span class="grow">Neler düşünüyorsun?</span><span>＋</span></div><div id="feedPosts"></div></section>
<section id="discover" class="view"><div class="sectionhead">Keşfet</div><div class="form"><input id="search" class="field" placeholder="Paylaşım veya sohbet odası ara..." aria-label="Ara"></div><div id="searchResults"></div></section>
<section id="compose" class="view"><div class="sectionhead">Yeni paylaşım</div><div class="form"><textarea id="postText" class="field" rows="7" maxlength="2000" placeholder="Ne paylaşmak istiyorsun?"></textarea><button id="publish" class="primary">Paylaş</button><p class="muted">Paylaşımın giriş yapan üyeler tarafından görülebilir.</p></div></section>
<section id="rooms" class="view"><div class="sectionhead">Sohbet odaları</div><div class="subhead">Bir konu seç, insanlarla tanış ve birlikte öğren.</div><div id="roomList"></div></section>
<section id="chat" class="view"><div class="sectionhead"><button id="backRooms" class="iconbtn">‹</button><span id="chatTitle"></span></div><div id="chatMessages" class="chatmessages"></div><form id="chatForm" class="chatbar"><input id="chatInput" class="field" maxlength="1000" placeholder="Mesaj yaz..." autocomplete="off"><button class="primary" type="submit">Gönder</button></form></section>
<section id="profile" class="view"><div class="profile"><div class="profiletop"><div><h2 id="profileName">Üye</h2><div class="muted" id="profileHandle">@uye</div></div><div id="profileAvatar" class="avatar large">Ü</div></div><p id="profileBio">InSync'te yeni insanlarla tanışıyorum.</p><div id="profileTags" class="tags"></div><button class="secondary" id="editProfileBtn">Profili düzenle</button><h3>Paylaşımlarım</h3><div id="profilePosts"></div></div></section>
<section id="edit" class="view"><div class="sectionhead">Profilimi düzenle</div><form class="form" id="profileForm"><label>Ad<input class="field" id="editName" maxlength="60"></label><label>Kullanıcı adı<input class="field" id="editHandle" maxlength="30"></label><label>Biyografi<textarea class="field" id="editBio" maxlength="300" rows="4"></textarea></label><label>İlgi alanları (virgülle ayır)<input class="field" id="editTags" maxlength="200" placeholder="Almanca, Müzik, Felsefe"></label><label>Profil fotoğrafı (bu cihazda saklanır)<input class="field" id="editPhoto" type="file" accept="image/*"></label><button class="primary" type="submit">Kaydet</button></form></section>
<nav class="nav" id="nav"><button data-view="feed" aria-label="Ana akış">⌂</button><button data-view="discover" aria-label="Keşfet">⌕</button><button data-view="compose" aria-label="Paylaş">＋</button><button data-view="rooms" aria-label="Sohbet odaları">♧</button><button data-view="profile" aria-label="Profilim">◎</button></nav></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
import {getFirestore,collection,addDoc,onSnapshot,query,orderBy,serverTimestamp,limit} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
const firebaseConfig = {
    apiKey: "AIzaSyC8EA2eeb_6sF9pXta2J_QgAYjzb1JdH0E",
    authDomain: "insync-d44db.firebaseapp.com",
    projectId: "insync-d44db",
    storageBucket: "insync-d44db.firebasestorage.app",
    messagingSenderId: "984274373406",
    appId: "1:984274373406:web:321982f96496be816e170f",
    measurementId: "G-GTK1H0TEN2"
  };
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);const rooms=[{id:'almanca-a1',icon:'🇩🇪',name:'Almanca A1',description:'Yeni başlayanlar için Almanca pratik'},{id:'almanca-a2',icon:'🇩🇪',name:'Almanca A2',description:'Günlük konuşmalar ve dil pratiği'},{id:'almanca-b1',icon:'🇩🇪',name:'Almanca B1',description:'Orta seviye sohbetler'},{id:'muzik',icon:'🎵',name:'Müzik ve Sanat',description:'Beste, enstrümanlar ve müzik'},{id:'felsefe',icon:'📚',name:'Kitap ve Felsefe',description:'Fikirler, kitaplar ve düşünceler'},{id:'sinema',icon:'🎬',name:'Sinema',description:'Filmler, diziler ve öneriler'}];
let user=null,posts=[],unsubscribePosts=null,unsubscribeRoom=null,activeRoom=null,feedMode='all',view='feed';
function profileKey(){return 'insync-profile-'+(user?.uid||'anon')};function photoKey(){return 'insync-photo-'+(user?.uid||'anon')};function profile(){try{return JSON.parse(localStorage.getItem(profileKey())||'{}')}catch{return {}}}function displayName(){const p=profile();return p.handle||p.name||user?.email?.split('@')[0]||'Üye'}function letter(s){return (s||'Ü').charAt(0).toLocaleUpperCase('tr')}
function avatar(name,large=false){const e=document.createElement('div');e.className='avatar'+(large?' large':'');e.textContent=letter(name);return e}
function show(next){if(!user)return;if(view==='chat'&&next!=='chat'&&unsubscribeRoom){unsubscribeRoom();unsubscribeRoom=null}view=next;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===next));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('selected',b.dataset.view===next||(next==='chat'&&b.dataset.view==='rooms')||(next==='edit'&&b.dataset.view==='profile')));window.scrollTo(0,0);if(next==='profile')renderProfile();if(next==='discover')renderSearch();if(next==='rooms')renderRooms()}
function renderRooms(){const root=$('roomList');root.replaceChildren();rooms.forEach(r=>{const item=document.createElement('div');item.className='roomitem';const ico=document.createElement('div');ico.className='roomemoji';ico.textContent=r.icon;const text=document.createElement('div');text.className='grow';const n=document.createElement('div');n.className='roomname';n.textContent=r.name;const d=document.createElement('div');d.className='roomdesc';d.textContent=r.description;text.append(n,d);const arrow=document.createElement('span');arrow.textContent='›';item.append(ico,text,arrow);item.addEventListener('click',()=>openRoom(r));root.append(item)})}
function openRoom(r){activeRoom=r;show('chat');$('chatTitle').textContent=r.icon+' '+r.name;$('chatMessages').replaceChildren();const info=document.createElement('p');info.className='notice';info.textContent='Mesajlar yükleniyor...';$('chatMessages').append(info);unsubscribeRoom=onSnapshot(query(collection(db,'rooms',r.id,'messages'),orderBy('createdAt','asc'),limit(100)),snap=>{const root=$('chatMessages');root.replaceChildren();if(snap.empty){const empty=document.createElement('div');empty.className='empty';empty.textContent='Bu odada henüz mesaj yok. İlk mesajı sen yaz!';root.append(empty)}snap.forEach(doc=>{const m=doc.data(),b=document.createElement('div');b.className='bubble'+(m.userId===user.uid?' mine':'');const n=document.createElement('strong');n.textContent=m.username||'Üye';const t=document.createElement('div');t.textContent=m.text||'';b.append(n,t);root.append(b)})},err=>{$('chatMessages').textContent='Sohbet yüklenemedi. Firestore oda mesajı kurallarını kontrol et. ('+err.code+')'})}
$('chatForm').addEventListener('submit',async e=>{e.preventDefault();if(!activeRoom||!user)return;const input=$('chatInput'),text=input.value.trim();if(!text)return;const btn=e.target.querySelector('button');btn.disabled=true;try{await addDoc(collection(db,'rooms',activeRoom.id,'messages'),{text,userId:user.uid,username:displayName(),createdAt:serverTimestamp()});input.value=''}catch(err){alert('Mesaj gönderilemedi: '+err.code)}finally{btn.disabled=false}});
function renderPosts(){const root=$('feedPosts');root.replaceChildren();const visible=posts.filter(p=>feedMode==='all'||p.userId===user.uid);if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Henüz paylaşım yok. İlk paylaşımı sen yap!';root.append(empty)}visible.forEach(p=>root.append(makePost(p)))}
function makePost(p){const item=document.createElement('article');item.className='post';const av=avatar(p.username||'Üye'),body=document.createElement('div');body.className='postbody';const head=document.createElement('div');head.className='posthead';const n=document.createElement('span');n.className='name';n.textContent=p.username||'Üye';const time=document.createElement('span');time.className='muted';time.textContent=p.createdAt?.toDate?.().toLocaleDateString('tr-TR')||'Yeni';head.append(n,time);const txt=document.createElement('div');txt.className='posttext';txt.textContent=p.text||'';const actions=document.createElement('div');actions.className='actions';const share=document.createElement('button');share.textContent='↗';share.title='Paylaşımı kopyala';share.onclick=async()=>{try{await navigator.clipboard.writeText(p.text||'');alert('Paylaşım kopyalandı')}catch{alert('Kopyalanamadı')}};actions.append(share);body.append(head,txt,actions);item.append(av,body);return item}
function renderProfile(){const p=profile(),name=p.name||displayName();$('profileName').textContent=name;$('profileHandle').textContent='@'+(p.handle||'uye');$('profileBio').textContent=p.bio||'InSync’te yeni insanlarla tanışıyorum.';$('profileTags').replaceChildren();(p.tags||['Almanca','Müzik','Felsefe']).forEach(tag=>{const e=document.createElement('span');e.className='tag';e.textContent=tag;$('profileTags').append(e)});const av=$('profileAvatar'),img=localStorage.getItem(photoKey());av.textContent=img?'':letter(name);av.style.backgroundImage=img?`url("${img}")`:'';const cp=$('composeAvatar');cp.textContent=img?'':letter(name);cp.style.backgroundImage=img?`url("${img}")`:'';const root=$('profilePosts');root.replaceChildren();const mine=posts.filter(x=>x.userId===user.uid);if(!mine.length)root.textContent='Henüz paylaşımın yok.';mine.forEach(x=>root.append(makePost(x)))}
function renderSearch(){const q=$('search').value.trim().toLocaleLowerCase('tr');const root=$('searchResults');root.replaceChildren();const matchingRooms=rooms.filter(r=>(r.name+' '+r.description).toLocaleLowerCase('tr').includes(q));matchingRooms.forEach(r=>{const b=document.createElement('div');b.className='roomitem';b.textContent=r.icon+' '+r.name+' — '+r.description;b.onclick=()=>openRoom(r);root.append(b)});posts.filter(p=>q&&(p.text+' '+p.username).toLocaleLowerCase('tr').includes(q)).slice(0,20).forEach(p=>root.append(makePost(p)));if(!root.children.length)root.innerHTML='<div class="empty">Sonuç bulunamadı.</div>'}
$('publish').onclick=async()=>{const text=$('postText').value.trim();if(!text)return;const btn=$('publish');btn.disabled=true;try{await addDoc(collection(db,'posts'),{text,userId:user.uid,username:displayName(),createdAt:serverTimestamp()});$('postText').value='';show('feed')}catch(err){alert('Paylaşım kaydedilemedi: '+err.code)}finally{btn.disabled=false}};
$('profileForm').onsubmit=e=>{e.preventDefault();const p={name:$('editName').value.trim(),handle:$('editHandle').value.trim().replace(/^@/,'').replace(/[^a-zA-Z0-9_.]/g,'').slice(0,30),bio:$('editBio').value.trim(),tags:$('editTags').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,12)};localStorage.setItem(profileKey(),JSON.stringify(p));show('profile')};
$('editPhoto').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>700000){alert('Fotoğraf 700 KB altında olmalı.');return}const reader=new FileReader();reader.onload=()=>{try{localStorage.setItem(photoKey(),reader.result);renderProfile()}catch{alert('Fotoğraf bu cihazda saklanamadı.')}};reader.readAsDataURL(file)};
$('editProfileBtn').onclick=()=>{const p=profile();$('editName').value=p.name||'';$('editHandle').value=p.handle||'';$('editBio').value=p.bio||'';$('editTags').value=(p.tags||[]).join(', ');show('edit')};
$('login').onclick=async()=>{try{$('authStatus').textContent='Giriş yapılıyor...';await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('authStatus').textContent='Giriş başarısız: '+e.code}};
$('register').onclick=async()=>{try{$('authStatus').textContent='Üyelik oluşturuluyor...';await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('authStatus').textContent='Üyelik başarısız: '+e.code}};
$('logout').onclick=()=>signOut(auth).catch(e=>alert(e.message));$('menu').onclick=()=>$('menuPanel').classList.toggle('hidden');$('topProfile').onclick=()=>show('profile');$('composeShortcut').onclick=()=>show('compose');$('backRooms').onclick=()=>show('rooms');$('search').oninput=renderSearch;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));document.querySelectorAll('[data-feed]').forEach(b=>b.onclick=()=>{feedMode=b.dataset.feed;document.querySelectorAll('[data-feed]').forEach(x=>x.classList.toggle('active',x===b));renderPosts()});
onAuthStateChanged(auth,u=>{user=u;if(unsubscribePosts){unsubscribePosts();unsubscribePosts=null}if(unsubscribeRoom){unsubscribeRoom();unsubscribeRoom=null}if(!u){$('auth').classList.remove('hidden');$('main').classList.add('hidden');$('nav').style.display='none';$('menuPanel').classList.add('hidden');return}$('auth').classList.add('hidden');$('main').classList.remove('hidden');$('nav').style.display='flex';show('feed');renderProfile();unsubscribePosts=onSnapshot(query(collection(db,'posts'),orderBy('createdAt','desc'),limit(100)),snap=>{posts=snap.docs.map(d=>({id:d.id,...d.data()}));renderPosts();renderProfile();if(view==='discover')renderSearch()},err=>{$('feedPosts').textContent='Paylaşımlar yüklenemedi: '+err.code+' (Firestore kurallarını kontrol et.)'})});
</script></body></html>
