<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InSync</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #000000;
}

/* GİRİŞ */

#splash {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.logo {
    font-size: 46px;
    font-weight: 700;
    letter-spacing: -2px;
}

/* ANA UYGULAMA */

#app {
    display: none;
    max-width: 620px;
    margin: auto;
    min-height: 100vh;
    border-left: 1px solid #eeeeee;
    border-right: 1px solid #eeeeee;
}

header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #eeeeee;
    position: sticky;
    top: 0;
    background: white;
}

header .logo {
    font-size: 25px;
    letter-spacing: -1px;
}

/* PAYLAŞIMLAR */

.post {
    display: flex;
    padding: 20px;
    border-bottom: 1px solid #eeeeee;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #eeeeee;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    margin-right: 12px;
    flex-shrink: 0;
}

.content {
    flex: 1;
}

.username {
    font-weight: 600;
    margin-bottom: 6px;
}

.text {
    font-size: 15px;
    line-height: 1.45;
}

.actions {
    margin-top: 14px;
    display: flex;
    gap: 22px;
    font-size: 20px;
}

.action {
    cursor: pointer;
}

/* ALT MENÜ */

nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 620px;
    height: 60px;
    background: white;
    border-top: 1px solid #eeeeee;
    display: flex;
    justify-content: space-around;
    align-items: center;
    font-size: 23px;
}

</style>
</head>

<body>

<!-- İLK EKRAN -->

<div id="splash" onclick="openApp()">
    <div class="logo">InSync</div>
</div>


<!-- ANA AKIŞ -->

<div id="app">

<header>
    <div class="logo">InSync</div>
</header>


<div class="post">

    <div class="avatar">D</div>

    <div class="content">

        <div class="username">deniz</div>

        <div class="text">
            A1 Almanca pratiği yapmak isteyen var mı?
        </div>

        <div class="actions">
            <span class="action">♡</span>
            <span class="action">○</span>
            <span class="action">↗</span>
        </div>

    </div>

</div>


<div class="post">

    <div class="avatar">E</div>

    <div class="content">

        <div class="username">elif</div>

        <div class="text">
            Felsefe üzerine sohbet etmek isteyenlerle küçük bir grup kurmak istiyorum.
        </div>

        <div class="actions">
            <span class="action">♡</span>
            <span class="action">○</span>
            <span class="action">↗</span>
        </div>

    </div>

</div>


<div class="post">

    <div class="avatar">M</div>

    <div class="content">

        <div class="username">mert</div>

        <div class="text">
            Akşam gitar ve müzik teorisi üzerine konuşmak isteyen var mı?
        </div>

        <div class="actions">
            <span class="action">♡</span>
            <span class="action">○</span>
            <span class="action">↗</span>
        </div>

    </div>

</div>


<nav>
    <span>⌂</span>
    <span>⌕</span>
    <span>＋</span>
    <span>♡</span>
    <span>◎</span>
</nav>

</div>


<script>

function openApp() {

    document.getElementById("splash").style.display = "none";

    document.getElementById("app").style.display = "block";

}

</script>

</body>
</html>
